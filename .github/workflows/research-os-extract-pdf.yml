name: Research OS · Read a catalogue PDF (Manual)
run-name: "Read ${{ inputs.record_id }} · candidate passages"
on:
  workflow_dispatch:
    inputs:
      record_id:
        description: "Choose an existing catalogue entry"
        type: choice
        required: true
        default: GEO-015
        options:
          - GEO-015
          - GEO-003
      keywords:
        description: "Optional keywords separated by ; (leave blank for defaults)"
        required: false
        default: ""
        type: string
permissions:
  contents: read
jobs:
  extract-document:
    name: Link, read, and find passages
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Download project files
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF reader
        run: python -m pip install "pymupdf>=1.26,<2.0"
      - name: Read the original PDF and find page-linked passages
        env:
          RECORD_ID: ${{ inputs.record_id }}
          SEARCH_TERMS: ${{ inputs.keywords }}
        run: |
          python research-lab/extract_document.py --id "$RECORD_ID" --keywords "$SEARCH_TERMS"
      - name: Attach report files to this run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-os-document-test
          path: research-lab/output/
          if-no-files-found: ignore
          retention-days: 7
